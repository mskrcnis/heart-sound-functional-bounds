name: Verify research release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      CUBLAS_WORKSPACE_CONFIG: ':4096:8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Verify deposited files and evidence
        run: python scripts/verify_repository.py
      - name: Install numerical dependencies
        run: |
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Run synthetic numerical tests
        run: python scripts/run_tests.py
      - name: Run synthetic example
        run: python examples/synthetic_bounds.py
      - name: Check pinned upstream integration
        run: |
          python scripts/fetch_upstream.py
          python scripts/run_tests.py --upstream-only
      - name: Rebuild published figures and tables
        run: python scripts/reproduce_figures.py
